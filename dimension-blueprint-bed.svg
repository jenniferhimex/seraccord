<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="archGridBed" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#222B35" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>
    <style>
      .dim-line { stroke: #4A7A96; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .dim-badge-bg { fill: #4A7A96; rx: 12; }
      .dim-badge-bg-sub { fill: #FFFFFF; stroke: #4A7A96; stroke-width: 1.5; rx: 12; }
      .dim-badge-text { font-family: 'Aileron', -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .dim-badge-subtext { font-family: 'Aileron', -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #4A7A96; text-anchor: middle; }
      .furniture-outline { stroke: #222B35; stroke-width: 2; fill: #FAF7F2; fill-opacity: 0.95; stroke-linejoin: round; }
      .furniture-wood { fill: #A89B8A; fill-opacity: 0.4; stroke: #8B4F3A; stroke-width: 1.2; }
    </style>
  </defs>

  <!-- Background Grid -->
  <rect width="100%" height="100%" fill="#F4EFE7"/>
  <rect width="100%" height="100%" fill="url(#archGridBed)"/>

  <!-- Bed Isometric Architectural Projection -->
  <g transform="translate(190, 110)">
    <!-- Base Wood Feet -->
    <rect x="25" y="240" width="30" height="16" rx="2" class="furniture-wood"/>
    <rect x="360" y="240" width="30" height="16" rx="2" class="furniture-wood"/>
    <rect x="520" y="200" width="30" height="16" rx="2" class="furniture-wood"/>

    <!-- Headboard -->
    <path d="M 20 50 L 530 20 L 530 140 L 20 170 Z" class="furniture-outline"/>
    <path d="M 30 60 L 520 30 L 520 130 L 30 160 Z" fill="#EAE3D7" stroke="#222B35" stroke-width="1"/>

    <!-- Bed Platform / Frame -->
    <path d="M 20 170 L 380 245 L 530 190 L 530 140 L 20 140 Z" class="furniture-outline"/>

    <!-- Mattress -->
    <path d="M 35 155 L 365 225 L 515 175 L 185 125 Z" fill="#FFFFFF" stroke="#222B35" stroke-width="1.5"/>

    <!-- Pillows -->
    <rect x="70" y="110" width="90" height="50" rx="6" fill="#F4EFE7" stroke="#222B35" stroke-width="1"/>
    <rect x="180" y="100" width="90" height="50" rx="6" fill="#F4EFE7" stroke="#222B35" stroke-width="1"/>
    <rect x="290" y="90" width="90" height="50" rx="6" fill="#F4EFE7" stroke="#222B35" stroke-width="1"/>

    <!-- Duvet / Linen Throw Fold -->
    <path d="M 120 175 L 370 235 L 515 185 L 260 140 Z" fill="#E3D9CC" stroke="#222B35" stroke-width="1.2"/>
  </g>

  <!-- Dimension 1: Total Width (King: 206 cm / 81.1") -->
  <line x1="210" y1="45" x2="720" y2="45" class="dim-line"/>
  <line x1="210" y1="37" x2="210" y2="53" stroke="#4A7A96" stroke-width="2"/>
  <line x1="720" y1="37" x2="720" y2="53" stroke="#4A7A96" stroke-width="2"/>
  
  <g transform="translate(410, 31)">
    <rect x="0" y="0" width="76" height="26" class="dim-badge-bg"/>
    <text x="38" y="18" class="dim-badge-text">206 cm</text>
    <rect x="82" y="0" width="70" height="26" class="dim-badge-bg-sub"/>
    <text x="117" y="18" class="dim-badge-subtext">81.1&quot;</text>
  </g>

  <!-- Dimension 2: Length (228 cm / 89.8") -->
  <line x1="160" y1="180" x2="520" y2="380" class="dim-line"/>
  <line x1="152" y1="175" x2="165" y2="185" stroke="#4A7A96" stroke-width="2"/>
  <line x1="512" y1="375" x2="525" y2="385" stroke="#4A7A96" stroke-width="2"/>

  <g transform="translate(290, 310)">
    <rect x="0" y="0" width="76" height="26" class="dim-badge-bg"/>
    <text x="38" y="18" class="dim-badge-text">228 cm</text>
    <rect x="82" y="0" width="70" height="26" class="dim-badge-bg-sub"/>
    <text x="117" y="18" class="dim-badge-subtext">89.8&quot;</text>
  </g>

  <!-- Dimension 3: Headboard Height (102 cm / 40.2") -->
  <line x1="770" y1="120" x2="770" y2="320" class="dim-line"/>
  <line x1="762" y1="120" x2="778" y2="120" stroke="#4A7A96" stroke-width="2"/>
  <line x1="762" y1="320" x2="778" y2="320" stroke="#4A7A96" stroke-width="2"/>

  <g transform="translate(780, 200)">
    <rect x="0" y="0" width="76" height="26" class="dim-badge-bg"/>
    <text x="38" y="18" class="dim-badge-text">102 cm</text>
    <rect x="0" y="32" width="76" height="24" class="dim-badge-bg-sub"/>
    <text x="38" y="48" class="dim-badge-subtext">40.2&quot;</text>
  </g>

  <!-- Ground Reference Line -->
  <line x1="160" y1="375" x2="760" y2="375" stroke="#222B35" stroke-width="1.5" stroke-opacity="0.3"/>
  <text x="460" y="415" font-family="'Helvetica Neue', sans-serif" font-size="12" font-weight="600" letter-spacing="0.12em" fill="#222B35" fill-opacity="0.6" text-anchor="middle">
    ARCHITECTURAL RATIO: 1:20 ARCHIVAL SCALE · SOLID EUROPEAN OAK INTERNAL SUBFRAME
  </text>
</svg>
