<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="archGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#222B35" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>
    <style>
      .dim-line { stroke: #4A7A96; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .dim-arrow { fill: #4A7A96; }
      .dim-badge-bg { fill: #4A7A96; rx: 12; }
      .dim-badge-bg-sub { fill: #FFFFFF; stroke: #4A7A96; stroke-width: 1.5; rx: 12; }
      .dim-badge-text { font-family: 'Aileron', -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .dim-badge-subtext { font-family: 'Aileron', -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #4A7A96; text-anchor: middle; }
      .furniture-outline { stroke: #222B35; stroke-width: 2; fill: #FAF7F2; fill-opacity: 0.9; stroke-linejoin: round; }
      .furniture-cushion { stroke: #222B35; stroke-width: 1.2; stroke-opacity: 0.7; fill: #FFFFFF; fill-opacity: 0.6; }
      .furniture-wood { fill: #A89B8A; fill-opacity: 0.4; stroke: #8B4F3A; stroke-width: 1.2; }
    </style>
  </defs>

  <!-- Background Grid -->
  <rect width="100%" height="100%" fill="#F4EFE7"/>
  <rect width="100%" height="100%" fill="url(#archGrid)"/>

  <!-- Sofa 3D/Isometric Architectural Projection -->
  <g transform="translate(180, 110)">
    <!-- Base Wood Plinths -->
    <rect x="20" y="240" width="40" height="14" rx="2" class="furniture-wood"/>
    <rect x="140" y="240" width="40" height="14" rx="2" class="furniture-wood"/>
    <rect x="260" y="240" width="40" height="14" rx="2" class="furniture-wood"/>
    <rect x="380" y="240" width="40" height="14" rx="2" class="furniture-wood"/>
    <rect x="490" y="235" width="40" height="14" rx="2" class="furniture-wood"/>

    <!-- Main Sectional Body Base -->
    <path d="M 10 240 L 410 240 L 530 210 L 530 140 L 410 140 L 10 140 Z" class="furniture-outline"/>

    <!-- Left Armrest -->
    <rect x="10" y="100" width="50" height="140" rx="4" class="furniture-outline"/>
    
    <!-- Seat Cushions (Modular 3-Section Base + Chaise Return) -->
    <rect x="65" y="150" width="110" height="85" rx="6" class="furniture-cushion"/>
    <rect x="180" y="150" width="110" height="85" rx="6" class="furniture-cushion"/>
    <rect x="295" y="150" width="110" height="85" rx="6" class="furniture-cushion"/>
    
    <!-- Chaise Return module (Right) -->
    <path d="M 410 150 L 520 120 L 520 205 L 410 235 Z" class="furniture-cushion"/>

    <!-- Back Cushions -->
    <rect x="65" y="50" width="110" height="95" rx="5" class="furniture-outline"/>
    <rect x="180" y="50" width="110" height="95" rx="5" class="furniture-outline"/>
    <rect x="295" y="50" width="110" height="95" rx="5" class="furniture-outline"/>
    <path d="M 410 50 L 520 25 L 520 120 L 410 145 Z" class="furniture-outline"/>

    <!-- Accent Pillows -->
    <rect x="75" y="80" width="40" height="60" rx="4" fill="#EAE3D7" stroke="#222B35" stroke-width="1"/>
    <rect x="190" y="80" width="40" height="60" rx="4" fill="#EAE3D7" stroke="#222B35" stroke-width="1"/>
    <rect x="305" y="80" width="40" height="60" rx="4" fill="#EAE3D7" stroke="#222B35" stroke-width="1"/>
  </g>

  <!-- Dimension 1: Total Width (309 cm / 121.7") -->
  <line x1="190" y1="50" x2="600" y2="50" class="dim-line"/>
  <line x1="190" y1="42" x2="190" y2="58" stroke="#4A7A96" stroke-width="2"/>
  <line x1="600" y1="42" x2="600" y2="58" stroke="#4A7A96" stroke-width="2"/>
  
  <g transform="translate(325, 36)">
    <rect x="0" y="0" width="76" height="26" class="dim-badge-bg"/>
    <text x="38" y="18" class="dim-badge-text">309 cm</text>
    <rect x="82" y="0" width="74" height="26" class="dim-badge-bg-sub"/>
    <text x="119" y="18" class="dim-badge-subtext">121.7&quot;</text>
  </g>

  <!-- Dimension 2: Total Depth / Return (245 cm / 96.5") -->
  <line x1="600" y1="50" x2="710" y2="135" class="dim-line"/>
  <line x1="595" y1="45" x2="608" y2="55" stroke="#4A7A96" stroke-width="2"/>
  <line x1="705" y1="130" x2="718" y2="140" stroke="#4A7A96" stroke-width="2"/>

  <g transform="translate(640, 72)">
    <rect x="0" y="0" width="76" height="26" class="dim-badge-bg"/>
    <text x="38" y="18" class="dim-badge-text">245 cm</text>
    <rect x="82" y="0" width="70" height="26" class="dim-badge-bg-sub"/>
    <text x="117" y="18" class="dim-badge-subtext">96.5&quot;</text>
  </g>

  <!-- Dimension 3: Armrest Height (65 cm / 25.6") -->
  <line x1="140" y1="210" x2="140" y2="350" class="dim-line"/>
  <line x1="132" y1="210" x2="148" y2="210" stroke="#4A7A96" stroke-width="2"/>
  <line x1="132" y1="350" x2="148" y2="350" stroke="#4A7A96" stroke-width="2"/>

  <g transform="translate(80, 265)">
    <rect x="0" y="0" width="56" height="24" class="dim-badge-bg-sub"/>
    <text x="28" y="16" class="dim-badge-subtext">25.6&quot;</text>
  </g>

  <!-- Dimension 4: Total Back Height (86 cm / 33.9") -->
  <line x1="770" y1="160" x2="770" y2="350" class="dim-line"/>
  <line x1="762" y1="160" x2="778" y2="160" stroke="#4A7A96" stroke-width="2"/>
  <line x1="762" y1="350" x2="778" y2="350" stroke="#4A7A96" stroke-width="2"/>

  <g transform="translate(780, 240)">
    <rect x="0" y="0" width="72" height="26" class="dim-badge-bg"/>
    <text x="36" y="18" class="dim-badge-text">86 cm</text>
    <rect x="0" y="32" width="72" height="24" class="dim-badge-bg-sub"/>
    <text x="36" y="48" class="dim-badge-subtext">33.9&quot;</text>
  </g>

  <!-- Ground Reference Line -->
  <line x1="140" y1="365" x2="740" y2="365" stroke="#222B35" stroke-width="1.5" stroke-opacity="0.3"/>
  <text x="440" y="405" font-family="'Helvetica Neue', sans-serif" font-size="12" font-weight="600" letter-spacing="0.12em" fill="#222B35" fill-opacity="0.6" text-anchor="middle">
    ARCHITECTURAL RATIO: 1:20 ARCHIVAL SCALE · ZERO-TOOL MODULAR FRAMEWORK
  </text>
</svg>
